# Development environment for macOS on Apple Silicon (osx-arm64).
# NOT the reference environment: MINC exists for this platform only as
# minc-toolkit-v2 1.9.19 (2023) with minc2-simple 0.2.30, python <= 3.11,
# while results come from container/conda-linux-64.lock (1.9.18.15).
# Whether this env reproduces the reference results is what the public
# test kit measures; until it does, use it for code, unit tests and
# quick looks only.
name: hvr-cnn-dev
channels:
  - conda-forge
  - minc-forge
  - nodefaults
dependencies:
  - python=3.11
  - pytorch=2.13.*=cpu_generic_*
  # minc2-simple 0.2.30 (the only osx-arm64 build) requires numpy < 2
  - numpy=1.26.*
  - nibabel=5.4.*
  - minc-toolkit-v2=1.9.19=noblas_novisual*
  - minc2-simple=0.2.30
  - imagemagick=7.1.*
  - tqdm=4.*
  - pytest=9.*
  - pip
